version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cmv_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cmv_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cmv_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-cmv_saas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - cmv_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cmv_user} -d ${POSTGRES_DB:-cmv_saas}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cmv_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - cmv_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cmv_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cmv_user}:${POSTGRES_PASSWORD:-cmv_secure_pass}@postgres:5432/${POSTGRES_DB:-cmv_saas}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super_secret_refresh_key_change_in_production}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      PORT: 3001
      NODE_ENV: production
    ports:
      - "3001:3001"
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - cmv_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cmv_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - "3000:3000"
    networks:
      - cmv_network

networks:
  cmv_network:
    driver: bridge

volumes:
  postgres_data:
